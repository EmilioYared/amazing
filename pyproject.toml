[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation library (A-Maze-ing, 42 project)"
requires-python = ">=3.10"
readme = "src/mazegen/README.md"
license = { text = "MIT" }
keywords = ["maze", "generator", "backtracker", "perfect-maze"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mazegen = ["README.md"]

[tool.mypy]
mypy_path = "src"
exclude = ['build/', 'dist/']
